<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniFind Account</title><link rel="stylesheet" href="styles.css"><style>
:root{--auth-ink:#172554;--auth-muted:#475569;--auth-border:#cbd5e1;--auth-blue:#1d4ed8;--auth-blue-dark:#1e40af}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--auth-ink);background:#eff6ff}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top left,#dbeafe 0,transparent 52%),radial-gradient(ellipse at bottom right,#dcfce7 0,transparent 45%),#f8fafc}
.auth-card{width:min(460px,100%);padding:clamp(24px,5vw,36px);border:1px solid #dbe3ef;border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.12)}
.auth-card h1{margin:22px 0 8px;font-size:clamp(1.7rem,4vw,2.1rem);line-height:1.2;letter-spacing:-.04em;color:#0f172a}
.auth-card p{color:var(--auth-muted);line-height:1.6}
.auth-tabs{display:flex;gap:8px;margin:24px 0}
.auth-tabs button{flex:1;padding:12px;border-radius:11px;border:1px solid var(--auth-border);background:#f8fafc;color:#334155;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s}
.auth-tabs button.active{background:var(--auth-blue);border-color:var(--auth-blue);color:#fff}
.auth-tabs button:focus-visible,.auth-submit:focus-visible,.auth-links button:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.auth-form{display:grid;gap:15px}
.auth-form label{display:grid;gap:7px;font-size:14px;font-weight:700;color:#1e293b}
.auth-form input{width:100%;min-height:46px;padding:12px 13px;border-radius:10px;border:1px solid #b8c5d6;background:#fff;color:#111827;font-size:15px}
.auth-form input::placeholder{color:#64748b;opacity:1}
.auth-form input:focus{border-color:var(--auth-blue);outline:2px solid #bfdbfe}
.auth-submit{min-height:48px;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 8px 18px rgba(37,99,235,.2)}
.auth-submit:hover{background:var(--auth-blue-dark)}
.auth-submit:disabled{opacity:.65;cursor:wait}
.auth-note{font-size:13px;min-height:20px;margin-bottom:0;overflow-wrap:anywhere}
.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.auth-links button{background:none;border:0;padding:6px 0;color:#1d4ed8;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.auth-card .security-note{font-size:12px;padding:12px 13px;background:#f1f5f9;border-radius:10px;border:1px solid #e2e8f0;color:#334155}
.hidden{display:none!important}
@media(max-width:480px){.auth-wrap{padding:14px}.auth-card{padding:22px;border-radius:18px}.auth-links{flex-wrap:wrap}}
</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="brand"><span class="brand-mark">✦</span><span class="brand-name">OmniFind <span class="brand-tech">ACCOUNT</span></span></div><h1 id="authTitle">Create your account</h1><p id="authIntro">Create your own account to use OmniFind. No demo account is provided.</p><div class="auth-tabs"><button id="loginTab" type="button">Log in</button><button id="registerTab" class="active" type="button">Create account</button></div><form id="authForm" class="auth-form"><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label id="passwordLabel">Password<input id="password" type="password" autocomplete="current-password" required minlength="10" placeholder="At least 10 characters"></label><div id="resetFields" class="hidden"><label>New password<input id="newPassword" type="password" minlength="10" placeholder="At least 10 characters and one number"></label></div><button class="auth-submit" id="submitBtn" type="submit">Log in</button></form><div class="auth-links"><button id="forgotBtn" type="button">Forgot password?</button><button id="backLoginBtn" class="hidden" type="button">Back to login</button></div><p id="authMessage" class="auth-note" role="status"></p><p class="security-note">Use an email address you control and a unique password. Passwords are stored as password hashes, not plain text. Email verification and password-reset delivery require SMTP configuration.</p></section></main><script>
(()=>{const $=id=>document.getElementById(id);let mode=new URLSearchParams(location.search).has('token')?'reset':'register';const token=new URLSearchParams(location.search).get('token');function setMode(m){mode=m;['loginTab','registerTab'].forEach(id=>$(id).classList.toggle('active',(id==='loginTab'&&m==='login')||(id==='registerTab'&&m==='register')));$('authTitle').textContent=m==='register'?'Create your account':m==='forgot'?'Reset your password':m==='reset'?'Choose a new password':'Welcome back';$('authIntro').textContent=m==='register'?'Register with your email to use OmniFind.':m==='forgot'?'We will email a reset link if the account exists.':m==='reset'?'Choose a new password for your account.':'Sign in to search, save results and ingest files.';$('passwordLabel').classList.toggle('hidden',m==='forgot'||m==='reset');$('resetFields').classList.toggle('hidden',m!=='reset');$('email').classList.toggle('hidden',m==='reset');$('submitBtn').textContent={login:'Log in',register:'Create account',forgot:'Send reset link',reset:'Save new password'}[m];$('forgotBtn').classList.toggle('hidden',m!=='login');$('backLoginBtn').classList.toggle('hidden',m==='login');$('loginTab').classList.toggle('hidden',m==='forgot'||m==='reset');$('registerTab').classList.toggle('hidden',m==='forgot'||m==='reset');$('password').required=m==='login'||m==='register';$('newPassword').required=m==='reset';$('email').required=m!=='reset';$('authMessage').textContent='';} $('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('forgotBtn').onclick=()=>setMode('forgot');$('backLoginBtn').onclick=()=>{history.replaceState({},'', '/login');setMode('login')};$('authForm').onsubmit=async e=>{e.preventDefault();const message=$('authMessage');const submit=$('submitBtn');submit.disabled=true;message.textContent='Please wait…';let endpoint,body={email:$('email').value.trim(),password:$('password').value};if(mode==='login')endpoint='/api/auth/login';if(mode==='register')endpoint='/api/auth/register';if(mode==='forgot'){endpoint='/api/auth/forgot';body={email:$('email').value.trim()}}if(mode==='reset'){endpoint='/api/auth/reset';body={token,password:$('newPassword').value}}try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');message.textContent=d.message||'Success';if(mode==='login'){location.href='/';return}if(mode==='reset'){history.replaceState({},'', '/login');setMode('login')}else if(mode==='register'&&!d.email_delivery_configured){message.textContent=d.message+' For local testing, you can log in now; production should configure SMTP.'; }else if(mode==='register'){setMode('login');message.textContent=d.message}else if(mode==='forgot'){message.textContent=d.message}}catch(err){message.textContent=err.message}finally{submit.disabled=false}};setMode(mode)})();
</script></body></html>
